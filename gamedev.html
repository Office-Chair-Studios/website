<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Games | Office Chair Studios</title>
    <meta name="description" content="Explore games developed by Office Chair Studios, including Packet Snatch, a competitive 3v3 file extraction game.">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Aldrich&family=Anton+SC&family=BBH+Sans+Bartle&family=Quicksand:wght@300..700&family=Work+Sans:wght@100..900&display=swap" rel="stylesheet">

    <!-- Stylesheet -->
    <link rel="stylesheet" href="css/app.css">
</head>

<body>
    <main>

        <!-- Game Banner -->
        <section class="bgf">

            <!-- Background Video -->
            <video
                class="bgv"
                autoplay
                loop
                muted
                playsinline
                preload="metadata"
                aria-hidden="true"
            >
                <source
                    src="assets/videos/gameplay.mp4"
                    type="video/mp4"
                >
            </video>

            <!-- Navigation -->
            <nav class="nav" aria-label="Main navigation">
                <ul>
                    <li>
                        <a href="index.html">Home</a>
                    </li>
                </ul>

                <ul>
                    <li>
                        <a href="gamedev.html" aria-current="page">Games</a>
                    </li>
                </ul>

                <img
                    src="assets/other/Office_Chair_Studios_Icon_v2_trp.png"
                    class="Logo"
                    width="200"
                    alt="Office Chair Studios logo"
                >
            </nav>

            <!-- Game Title -->
            <div class="intro">
                <h1>Packet Snatch</h1>
            </div>

        </section>

        <!-- Game Information -->
        <section class="bginfo" aria-labelledby="overview-title">
            <div class="suintro">
                <h2 id="overview-title">Overview</h2>

                <p>
                    Packet Snatch is a 3v3 PvP file extraction
                    hacking game. Your objective is to secure
                    the key file and extract it before the
                    opposing team. Avoid sabotage, eliminate
                    enemy players, and survive to claim victory.
                </p>
            </div>
        </section>

    </main>
</body>
</html>
